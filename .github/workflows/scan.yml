name: TRON Auto Scanner

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover Active Owners
        env:
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
        run: python discover_owners.py

      - name: Scan Approvals & ABIs (transferFrom only)
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
        run: python tron_scanner.py

      - name: Commit updated results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add active_approvals.json active_approvals.csv discovered_addresses.txt
          git commit -m "Update scan results [Skip CI]" || exit 0
          git push
